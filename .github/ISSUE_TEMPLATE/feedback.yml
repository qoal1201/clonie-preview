name: 사용 피드백
description: 설치, 실제 작업, 검색, 편집, 음성에서 겪은 일을 알려주세요.
title: "[피드백] "
body:
  - type: markdown
    attributes:
      value: "공개 이슈입니다. API 키, 개인 문서 전체, 민감한 화면은 올리지 마세요. 잘된 사례도 환영합니다."
  - type: textarea
    id: task
    attributes:
      label: 하려던 일과 기대
      placeholder: 어떤 자료로 무엇을 하려고 했나요?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 결과와 재현 순서
      placeholder: 클릭·입력 순서, 나타난 결과, 다시 해도 같은지 적어주세요.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 앱 빌드 / macOS / Mac 모델
      placeholder: "예: 20260910 / macOS 26.2 / MacBook Air M2"
    validations:
      required: true
  - type: textarea
    id: retrieval
    attributes:
      label: 검색에서 기대한 자료 (선택)
      description: 검색·음성 문제라면 입력한 질문, 찾고 싶었던 문서나 문단, 실제로 나온 자료를 알려주세요. 저장소에 답이 없던 질문도 도움이 됩니다.
  - type: textarea
    id: usefulness
    attributes:
      label: 실제 작업에 도움이 되었나요? (선택)
      description: 찾은 자료로 무엇을 할 수 있었는지, 결국 다른 도구를 썼다면 무엇이 부족했는지 알려주세요. 며칠 뒤 다시 사용한 경험도 환영합니다.
  - type: textarea
    id: sample
    attributes:
      label: 개인정보를 지운 예시 또는 화면 (선택)
      description: 실제 자료 대신 같은 문제를 재현하는 짧은 예시를 권합니다.
